# Optional: generate the Xcode project with XcodeGen (`brew install xcodegen`, then `xcodegen`).
name: DragonMood
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    GENERATE_INFOPLIST_FILE: YES
targets:
  DragonMood:
    type: application
    platform: iOS
    sources: [DragonMood]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DragonMood
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dragon Mood
  DragonMoodTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DragonMoodTests]
    dependencies:
      - target: DragonMood
